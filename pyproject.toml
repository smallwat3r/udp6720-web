[project]
name = "udp6720"
version = "0.1.0"
description = "Web dashboard to control a UNI-T UDP6720 DC power supply over RS232"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthieu Petiteau" }]
dependencies = ["pyserial>=3.5", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
udp6720-web = "udp6720.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
